# Builds and deploys the static @stratofold/client test client to
# GitHub Pages.
#
# The deployed bundle is public: it must contain no token and no default
# instance URL. Runtime configuration happens in the browser, and the
# Vite config refuses a production build while VITE_SF_* is set.
name: client-pages

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/client-pages.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: client-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            client/test-client/package-lock.json

      - name: Install the package
        working-directory: client
        run: npm ci

      - name: Test the package
        working-directory: client
        run: npm test

      - name: Type-check the README snippets
        working-directory: client
        run: npm run typecheck:readme

      - name: Install the test client
        working-directory: client/test-client
        run: npm ci

      - name: Test the test-client logic
        working-directory: client/test-client
        run: npm test

      - name: Build the Pages bundle
        working-directory: client/test-client
        env:
          SF_CLIENT_BASE: /stratofold/
        run: npm run build

      - name: Scan the bundle for bearer tokens
        run: |
          if grep -rIE 'sf_v1_[A-Za-z0-9_-]{20,}' client/test-client/dist; then
            echo "a bearer token was found in the Pages bundle" >&2
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/test-client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
